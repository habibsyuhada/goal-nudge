name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipe build"
        required: true
        default: debug
        type: choice
        options:
          - debug

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goal-nudge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Artifact di atas selalu terbungkus .zip lewat API/tombol download GitHub Actions —
      # menyulitkan install langsung dari HP. Release asset TIDAK dibungkus zip, jadi ini
      # kasih link download .apk langsung yang bisa di-tap dari browser HP.
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest-debug app/build/outputs/apk/debug/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Goal Nudge — debug APK terbaru" \
            --notes "Auto-build dari commit ${{ github.sha }}. Debug build (signed dengan debug keystore), khusus testing sendiri — bukan untuk rilis Play Store."
